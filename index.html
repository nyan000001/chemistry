<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { --bgcolor:#fff; --color:#000; }
:root:has(#darkmode:checked) { --bgcolor:#000; --color:#fff; }
:root:has(#showhydrogens:not(:checked)) #atoms g.H, .hidden { display:none; }
* { font:20px monospace; box-sizing:border-box; }
body { margin:0; background:var(--bgcolor); color:var(--color); }
#svg { touch-action:none; width:100dvw; height:calc(100dvh - 40px); }
#info { position:absolute; top:0; right:0; max-width:100dvw; background:var(--bgcolor); border:1px solid var(--color); }
#delete, #close { position:fixed; top:0; right:0; }
#name, #iupac { word-break:break-word; text-align:center; }
#name {padding:3px; margin-right:40px; }
#iupac { font-size:15px; }
#form { display:flex; position:fixed; bottom:0; width:100dvw; height:40px; }
#smiles { min-width:0; flex:1; }

#svg * { -webkit-tap-highlight-color:transparent; outline:none; }
circle { fill:var(--bgcolor); stroke-width:3; }
text { user-select:none; pointer-events:none; text-anchor:middle; dominant-baseline:middle; }
line:not(.hitbox) { pointer-events:none; }
#bonds, #atoms { stroke:var(--color); }
#bonds line, #atoms line { stroke-width:3; }
#bonds line.hitbox { stroke:transparent; stroke-width:50; pointer-events:stroke; cursor:pointer; }

#atoms g.H { pointer-events:none; }
#atoms g.C circle { fill:#555; }
#atoms g.N circle { fill:#35f; }
#atoms g.O circle { fill:#f00; }
#atoms g.F circle { fill:#9e5; }
#atoms g.S circle { fill:#ff0; }

#atoms g:hover > circle, #atoms g:focus > circle, #bonds g:hover .hitbox ~ line, #bonds g:focus .hitbox ~ line { stroke-width:5 !important; }
#atoms g circle { cursor:pointer; }
#atoms g.H { pointer-events:none; }
#atoms g.H circle { r:15; }
#atoms g.H text { font-size:17px; }

#atoms text { fill:#fff; paint-order:stroke fill; text-shadow:0 0 2px #000; }

#highlights line, #highlights text { stroke:#999; }
#highlights circle, #highlights text { fill:#999; }

.error { stroke:#f00 !important; }
.highlight line, .highlight circle { stroke:#fff; }

#settings { position:fixed; top:0; left:0; cursor:default; user-select:none; background:var(--bgcolor); padding:3px; }
#settings label { display:block; }
#settings label:hover { font-weight:bold; }

@media (pointer:fine) {
	#delete { display:none; }
}

@media (max-width:300px) {
	#jmol_appletinfotablediv { margin:0 calc(50dvw - 150px) }
}
</style>
</head>
<body>
<svg id="svg">
	<g id="highlights"></g>
	<g id="bonds"></g>
	<g id="atoms"></g>
</svg>
<details id="settings">
	<summary>Settings</summary>
	<label><input type="checkbox" id="darkmode">Dark mode</label>
	<label><input type="checkbox" id="showhydrogens" checked>Show hydrogens</label>
</details>
<input type="button" id="delete" value="🗑️">
<form id="form">
	<input type="reset" value="❌">
	<input id="smiles" spellcheck="false" autofocus>
	<input type="submit" value="🔎">
</form>
<div id="info" class="hidden">
	<input type="button" id="close" value="❌">
	<div id="name"></div>
	<div id="iupac"></div>
	<div id="applet"></div>
</div>
<script src="https://chemapps.stolaf.edu/jmol/jsmol/JSmol.min.js"></script>
<script type="module">
import OCL from "https://cdn.jsdelivr.net/npm/openchemlib@9.25.0/dist/openchemlib.js";
const ptable = [[0,0],[0,0],[0,0],[2,1],[2,2],[2,13],[2,14],[2,15],[2,16],[2,17],[2,18],[3,1],[3,2],[3,13],[3,14],[3,15],[3,16],[3,17],[3,18],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6],[4,7],[4,8],[4,9],[4,10],[4,11],[4,12],[4,13],[4,14],[4,15],[4,16],[4,17],[4,18],[5,1],[5,2],[5,3],[5,4],[5,5],[5,6],[5,7],[5,8],[5,9],[5,10],[5,11],[5,12],[5,13],[5,14],[5,15],[5,16],[5,17],[5,18],[6,1],[6,2],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,3],[6,4],[6,5],[6,6],[6,7],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[6,15],[6,16],[6,17],[6,18],[7,1],[7,2],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,3],[7,4],[7,5],[7,6],[7,7],[7,8],[7,9],[7,10],[7,11],[7,12],[7,13],[7,14],[7,15],[7,16],[7,17],[7,18]];
const atoms = [];
const bonds = [];
let timeout;
const get = id => document.getElementById(id);
get('applet').innerHTML = Jmol.getAppletHtml('jmol', { use:'HTML5', j2sPath:'https://chemapps.stolaf.edu/jmol/jsmol/j2s' });
const create = elem => document.createElementNS('http://www.w3.org/2000/svg', elem);
let smiles = '';
try {
	smiles = location.hash.slice(1);
} catch(err) {
	console.warn(err);
}
let mol = new OCL.Molecule(50, 50);
const groups = [
	['phenol', '|OHc1ccccc1|'],
	['benzene', '|c1ccccc1|'],
	['furan', '|c1ccoc1|'],
	['pyrrole', '|c1ccnc1|'],
	['thiophene', '|c1ccsc1|'],
	['pyridine', '|n1ccccc1|'],
	['pyrazole', '|n1nccc1|'],
	['imidazole', '|n1cncc1|'],
	['oxazole', '|o1cncc1|'],
	['thiazole', '|s1cncc1|'],
	['piperidine', '|C1CCCCN1|'],
	['pyrrolidine', '|C1CCCN1|'],
	['tetrahydrofuran', '|C1CCCO1|'],
	['aziridine', '|C1NC1|'],
	['epoxy', '|C1OC1|'],
	['episulfide', '|C1SC1|'],

	['acid anhydride', '|O=COC=O|'],
	['ester', '|C(=O)O|C'],
	['carboxylic acid', '|C(=O)OH|'],
	['amide', '|NC=O|'],
	['ketone', 'C|C(=O)|C'],
	['aldehyde', '|CH=O|'],
	['acyl chloride', '|C(=O)[Cl]|'],
	['thioester', '|C(=O)S|C'],
	['dithioester', '|C(=S)S|C'],
	['dithiocarboxylic acid', '|C(=S)SH|'],

	['sulfonamide', 'C|S(=O)(=O)N|'],
	['sulfonate ester', 'C|S(=O)(=O)O|C'],
	['sulfonic acid', 'C|S(=O)(=O)OH|'],
	['sulfone', 'C|S(=O)(=O)|C'],
	['sulfoxide', 'C|S(=O)|C'],

	['isothiocyanate', '|N=C=S|'],
	['isocyanate', '|N=C=O|'],
	['thiocyanate', '|SC#N|'],
	['cyanate', '|OC#N|'],
	['nitrile oxide', 'C|C#NO|'],
	['fulminate', '|ON#C|'],
	['nitrile', 'C|C#N|'],

	['azide', '|N=N=N|'],
	['azo', 'C|N=N|C'],
	['nitro', 'C|N(=O)=O|'],
	['nitro', 'C|N(=O)O|'],
	['hydrazone', '|C=NN|'],
	['imine', '|C=N|'],
	['amine', 'C|N|'],

	['ether', 'C|O|C'],
	['peroxy', 'C|OO|C'],
	['trioxy', 'C|OOO|C'],
	['tetroxy', 'C|OOOO|C'],
	['alcohol', 'C|OH|'],
	['hydroperoxy', 'C|OOH|'],
	['hydrotrioxy', 'C|OOOH|'],
	['hydrotetroxy', 'C|OOOOH|'],

	['sulfide', 'C|S|C'],
	['disulfide', 'C|SS|C'],
	['trisulfide', 'C|SSS|C'],
	['thiol', 'C|SH|'],
	['hydrodisulfide', 'C|SSH|'],
	['hydrotrisulfide', 'C|SSSH|'],

	['phosphate', '|P(=O)(O)(O)O|'],
	['phosphite', '|P(O)(O)O|'],
	['phosphine', '|P|'],

	['fluoride', '|[F]|'],
	['chloride', '|[Cl]|'],
	['bromide', '|[Br]|'],
	['iodide', '|[I]|'],
];
for(const group of groups) {
	const query = OCL.Molecule.fromSmiles(group[1].replace(/[\|H]/g, ''));
	query.setFragment(true);
	group[2] = query;
}
const getdist = (atom1, atom2) => {
	const dx = atom2.x - atom1.x;
	const dy = atom2.y - atom1.y;
	return [dx, dy, Math.sqrt(dx*dx+dy*dy)];
}
let radius = 25;
get('svg').onwheel = e => {
	radius -= e.deltaY > 0? 1: -1;
	if(radius < 15) {
		radius = 15;
	}
	clearTimeout(timeout);
	animate(0);
}
get('svg').ontouchstart = e => {
	if(e.touches.length != 2) return;
	const pinchDist = touches => Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
	let prevDist = pinchDist(e.touches);
	get('svg').ontouchmove = e => {
		if(e.touches.length != 2) return;
		const dist = pinchDist(e.touches);
		radius = Math.max(15, radius + (dist-prevDist)/2);
		prevDist = dist;
		clearTimeout(timeout);
		animate(0);
	}
	get('svg').ontouchend = () => {
		get('svg').ontouchmove = get('svg').ontouchend = null;
	}
}
if(smiles) {
	drawmolecule();
	get('smiles').value = smiles;
}
function drawmolecule() {
	if(!smiles) {
		mol = new OCL.Molecule(50, 50);
		return;
	}
	try {
		mol = OCL.Molecule.fromSmiles(smiles);
		mol.inventCoordinates(); 
	} catch(err) {
		console.warn(err);
		mol = new OCL.Molecule(50, 50);
		return;
	}
	let minX = Infinity;
	let minY = Infinity;
	let maxX = -Infinity;
	let maxY = -Infinity;
	for(let i = 0; i < mol.getAllAtoms(); i++) {
		const x = mol.getAtomX(i)*100;
		const y = mol.getAtomY(i)*100;
		minX = Math.min(minX, x);
		minY = Math.min(minY, y);
		maxX = Math.max(maxX, x);
		maxY = Math.max(maxY, y);
	}
	const offsetX = get('svg').clientWidth/2 - (minX+maxX)/2;
	const offsetY = get('svg').clientHeight/2 - (minY+maxY)/2;
	for(let i = 0; i < mol.getAllAtoms(); i++) {
		const [period, group] = ptable[mol.getAtomicNo(i)];
		atoms.push({ period, group, x:mol.getAtomX(i)*100+offsetX, y:mol.getAtomY(i)*100+offsetY, hydrogens:[] });
		createatom(i);
	}
	for(let i = 0; i < mol.getAllBonds(); i++) {
		updatebond(i);
	}
	for(let i = 0; i < mol.getAllAtoms(); i++) {
		validate(i);
	}
	highlight();
	clearTimeout(timeout);
	animate(0);
}
get('smiles').oninput = () => {
	smiles = get('smiles').value;
	history.replaceState(null, null, '#'+smiles);
	atoms.length = 0;
	bonds.length = 0;
	get('highlights').textContent = get('bonds').textContent = get('atoms').textContent = '';
	drawmolecule();
}
function validate(atomindex) {
	const invalid = mol.getOccupiedValence(atomindex) > mol.getMaxValence(atomindex);
	atoms[atomindex].g.classList[invalid? 'add': 'remove']('error');
	for(let i = 0; i < bonds.length; i++) {
		const atomindex1 = mol.getBondAtom(0, i);
		const atomindex2 = mol.getBondAtom(1, i);
		if(atomindex != atomindex1 && atomindex != atomindex2) continue;
		const invalid = atoms[atomindex1].g.classList.contains('error') || atoms[atomindex2].g.classList.contains('error');
		bonds[i].g.classList[invalid? 'add': 'remove']('error');
	}
}
function updatebond(bondindex) {
	let bond = bonds[bondindex];
	if(!bond) {
		bond = { g:create('g'), hitbox:create('line'), lines:[] };
		bonds.push(bond);
		bond.hitbox.classList.add('hitbox');
		bond.hitbox.onpointerdown = e => {
			const bondindex = bonds.indexOf(bond);
			mol.setBondOrder(bondindex, Math.min(3, mol.getBondOrder(bondindex)+(e.button? -1: 1)));
			updatebond(bondindex);
			generatesmiles();
		}
		bond.g.append(bond.hitbox);
		bond.g.tabIndex = 0;
		get('bonds').append(bond.g);
	}
	while(bond.lines.length < mol.getBondOrder(bondindex)) {
		const line = create('line');
		bond.lines.push(line);
		bond.g.append(line);
	}
	while(bond.lines.length > mol.getBondOrder(bondindex)) {
		bond.lines.pop().remove();
	}
	const atomindex1 = mol.getBondAtom(0, bondindex);
	const atomindex2 = mol.getBondAtom(1, bondindex);
	updatehydrogens(atomindex1);
	updatehydrogens(atomindex2);
	if(!mol.getBondOrder(bondindex)) {
		bond.g.remove();
		bonds.splice(bondindex, 1);
		mol.deleteBond(bondindex);
	}
	validate(atomindex1);
	validate(atomindex2);
}
function updatehydrogens(atomindex) {
	const atom = atoms[atomindex];
	while(atom.hydrogens.length > mol.getImplicitHydrogens(atomindex)) {
		atom.hydrogens.pop().g.remove();
	}
	while(atom.hydrogens.length < mol.getImplicitHydrogens(atomindex)) {
		const g = create('g');
		g.classList.add('H');
		const line = create('line');
		const circle = create('circle');
		const text = create('text');
		text.textContent = 'H';
		g.append(line, circle, text);
		atom.g.prepend(g);
		atom.hydrogens.push({ g, line, circle, text, x:atom.x+Math.random()-.5, y:atom.y+Math.random()-.5 });
	}
}
function moveatom(atomindex) {
	const atom = atoms[atomindex];
	mol.setAtomX(atomindex, atom.x*100);
	mol.setAtomY(atomindex, atom.y*100);
	if(atom.highlight) {
		atom.highlight.setAttribute('cx', atom.x);
		atom.highlight.setAttribute('cy', atom.y);
		atom.highlight.setAttribute('r', radius+10);
		const bbox = atom.highlight.parentNode.getBBox();
		atom.grouptext.setAttribute('x', bbox.x+bbox.width/2);
		atom.grouptext.setAttribute('y', bbox.y+bbox.height+7);
	}
	atom.circle.setAttribute('cx', atom.x);
	atom.circle.setAttribute('cy', atom.y);
	atom.circle.setAttribute('r', radius);
	atom.text.setAttribute('x', atom.x);
	atom.text.setAttribute('y', atom.y);
	for(const hydrogen of atom.hydrogens) {
		hydrogen.line.setAttribute('x1', atom.x);
		hydrogen.line.setAttribute('y1', atom.y);
		hydrogen.line.setAttribute('x2', hydrogen.x);
		hydrogen.line.setAttribute('y2', hydrogen.y);
		hydrogen.circle.setAttribute('cx', hydrogen.x);
		hydrogen.circle.setAttribute('cy', hydrogen.y);
		hydrogen.text.setAttribute('x', hydrogen.x);
		hydrogen.text.setAttribute('y', hydrogen.y);
	}
}
function createatom(atomindex, pointerdown) {
	const atom = atoms[atomindex];
	atom.g = create('g');
	atom.g.tabIndex = 0;
	atom.circle = create('circle');
	atom.text = create('text');
	const label = atom.text.textContent = mol.getAtomLabel(atomindex);
	atom.g.classList.add(label);
	atom.g.append(atom.circle, atom.text);
	get('atoms').append(atom.g);
	updatehydrogens(atomindex);
	moveatom(atomindex);
	atom.circle.onpointerdown = e => {
		const atomindex = atoms.indexOf(atom);
		if(e.button) {
			for(let i = mol.getAllBonds()-1; i >= 0; i--) {
				if(atomindex != mol.getBondAtom(0, i) && atomindex != mol.getBondAtom(1, i)) continue;
				mol.setBondOrder(i, 0);
				updatebond(i);
			}
			atom.g.remove();
			atoms.splice(atomindex, 1);
			mol.deleteAtom(atomindex);
			onpointermove = onpointerup = null;
			generatesmiles();
			return;
		}
		const selectedindex = atoms.findIndex(atom => atom.g == document.activeElement);
		if(selectedindex > -1 && selectedindex != atomindex) {
			if(mol.getBond(selectedindex, atomindex) == -1) {
				const bondindex = mol.addBond(selectedindex, atomindex);
				mol.setBondOrder(bondindex, 1);
				updatebond(bondindex);
				generatesmiles();
			}
		}
		onpointermove = e => {
			atom.x = e.pageX;
			atom.y = e.pageY;
			clearTimeout(timeout);
			animate(0);
		}
		onpointerup = () => {
			onpointerup = onpointermove = null;
		}
		atom.g.focus();
	}
	if(pointerdown) {
		atom.circle.onpointerdown({});
	}
}
get('delete').onpointerdown = () => {
	if(document.activeElement.parentNode == get('atoms')) {
		[...document.activeElement.children].at(-2).onpointerdown({ button:1 });
	} else if(document.activeElement.parentNode == get('bonds')) {
		document.activeElement.children[0].onpointerdown({ button:1 });
	}
}
get('svg').oncontextmenu = e => e.preventDefault();
get('svg').onpointerdown = e => {
	if(e.target == get('svg') && !e.button) {
		e.preventDefault();
		atoms.push({ x:e.pageX, y:e.pageY, period:2, group:14, hydrogens:[] });
		createatom(mol.addAtom(6), true);
		generatesmiles();
	}
}
let queue = Promise.resolve();
onkeydown = e => {
	if(e.key.toUpperCase() == 'H' && !e.ctrlKey) {
		e.preventDefault();
		get('showhydrogens').click();
		return;
	}
	if(e.target == get('smiles')) return;
	if(e.key == 'Delete') {
		e.preventDefault();
		get('delete').onpointerdown();
		return;
	}
	if(!e.key.startsWith('Arrow')) return;
	const atom = atoms.find(atom => atom.g == document.activeElement);
	if(!atom) return;
	e.preventDefault();
	queue = queue.then(async () => {
		let atomindex = atoms.indexOf(atom);
		if(atomindex == -1) return;
		let period = atom.period;
		let group = atom.group;
		let x = 0;
		let y = 0;
		let number = mol.getAtomicNo(atomindex);
		if(e.key == 'ArrowUp') {
			period--;
			y = 10;
		} else if(e.key == 'ArrowDown') {
			period++;
			y = -10;
		} else if(e.key == 'ArrowLeft') {
			group = { 5:2, 13:2 }[number] ?? group-1;
			x = 10;
		} else if(e.key == 'ArrowRight') {
			group = { 4:13, 12:13 }[number] ?? group+1;
			x = -10;
		} else {
			return;
		}
		await atom.text.animate({ translate:['0px 0px', x+'px '+y+'px'] }, 100).finished;
		atomindex = atoms.indexOf(atom);
		if(atomindex == -1) return;
		number = ptable.findIndex(arr => arr[0] == period && arr[1] == group);
		if(number == -1) {
			await atom.text.animate({ translate:[x+'px '+y+'px', '0px 0px'] }, 100).finished;
			return;
		}
		atom.g.classList.remove(mol.getAtomLabel(atomindex));
		mol.setAtomicNo(atomindex, number);
		const label = atom.text.textContent = mol.getAtomLabel(atomindex);
		atom.g.classList.add(label);
		atom.period = period;
		atom.group = group;
		await atom.text.animate({ translate:[(-x)+'px '+(-y)+'px', '0px 0px'] }, 100).finished;
		updatehydrogens(atomindex);
		validate(atomindex);
		generatesmiles();
	});
}
function animate(frame) {
	frame++;
	const size = radius*2;
	const idealdist = size*2;
	const selected = atoms.find(atom => atom.g == document.activeElement);
	const calculate = (atom1, atom2, idealdist) => {
		const [dx, dy, dist] = getdist(atom1, atom2);
		if(!dist) return { x:Math.random()-.5, y:Math.random()-.5, correction:0 };
		const nx = dx/dist;
		const ny = dy/dist;
		const correction = (dist-idealdist)/2;
		return { x:nx*correction, y:ny*correction, correction };
	}
	for(let i = 0; i < atoms.length; i++) {
		const atom1 = atoms[i];
		const neighbors = new Set();
		for(let j = 0; j < mol.getConnAtoms(i); j++) {
			neighbors.add(mol.getConnAtom(i, j));
		}
		for(let j = i+1; j < atoms.length; j++) {
			const atom2 = atoms[j];
			const offset = calculate(atom1, atom2, idealdist);
			if(offset.correction < 0 || neighbors.has(j)) { // either repelling or bonded
				if(atom1 != selected) {
					atom1.x += offset.x;
					atom1.y += offset.y;
				}
				if(atom2 != selected) {
					atom2.x -= offset.x;
					atom2.y -= offset.y;
				}
			}
		}
		const hydrogens = atom1.hydrogens;
		for(let i = 0; i < hydrogens.length; i++) {
			const hydrogen1 = hydrogens[i];
			for(let j = i+1; j < hydrogens.length; j++) {
				const hydrogen2 = hydrogens[j];
				const offset = calculate(hydrogen1, hydrogen2, size);
				if(offset.correction > 0) continue;
				hydrogen1.x += offset.x;
				hydrogen1.y += offset.y;
				hydrogen2.x -= offset.x;
				hydrogen2.y -= offset.y;
			}
			const offset = calculate(atom1, hydrogen1, radius+20);
			hydrogen1.x -= offset.x;
			hydrogen1.y -= offset.y;
		}
	}
	const maxX = get('svg').clientWidth-size;
	const maxY = get('svg').clientHeight-size;
	for(let i = 0; i < atoms.length; i++) {
		const atom = atoms[i];
		if(atom != selected) {
			if(atom.x < size) {
				atom.x += (size-atom.x)*.1;
			} else if(atom.x > maxX) {
				atom.x -= (atom.x-maxX)*.1;
			}
			if(atom.y < size) {
				atom.y += (size-atom.y)*.1;
			} else if(atom.y > maxY) {
				atom.y -= (atom.y-maxY)*.1;
			}
		}
		moveatom(i);
	}
	for(let i = 0; i < bonds.length; i++) {
		const bond = bonds[i];
		const atom1 = atoms[mol.getBondAtom(0, i)];
		const atom2 = atoms[mol.getBondAtom(1, i)];
		const [dx, dy, d] = getdist(atom1, atom2);
		const dist = d || 1;
		const nx = -dy / dist;
		const ny = dx / dist;
		const move = (line, offset) => {
			line.setAttribute('x1', atom1.x + nx * offset);
			line.setAttribute('y1', atom1.y + ny * offset);
			line.setAttribute('x2', atom2.x + nx * offset);
			line.setAttribute('y2', atom2.y + ny * offset);
		};
		if(bond.highlight) {
			move(bond.highlight, 0);
			bond.highlight.setAttribute('stroke-width', radius*2+20);
		}
		move(bond.hitbox, 0);
		for(let j = 0; j < bond.lines.length; j++) {
			move(bond.lines[j], (j-(bond.lines.length-1)/2)*6);
		}
	}
	if(frame < 200) {
		timeout = setTimeout(animate, 40, frame);
	}
}
onresize = () => {
	clearTimeout(timeout);
	animate(0);
}
get('close').onclick = () => {
	Jmol.script(jmol, 'zap');
	get('info').classList.add('hidden');
}
function generatesmiles() {
	try {
		smiles = mol.toSmiles();
		history.replaceState(null, null, '#'+smiles);
		get('smiles').value = smiles;
		mol.validate(); 
	} catch(err) {
		//console.warn(err);
	}
	highlight();
	clearTimeout(timeout);
	animate(0);
}
function highlight() {
	get('highlights').textContent = '';
	atoms.forEach(atom => {
		atom.g.classList.remove('highlight');
		delete atom.highlight;
		delete atom.grouptext;
	});
	bonds.forEach(bond => {
		bond.g.classList.remove('highlight');
		delete bond.highlight;
	});
	if(document.getElementsByClassName('error').length) return;
	const claimed = new Set();
	const searcher = new OCL.SSSearcher();
	searcher.setMolecule(mol);
	for(const [name, pattern, query] of groups) {
		searcher.setFragment(query);
		if(!searcher.findFragmentInMolecule()) continue;
		const arr = pattern.replace(/[\d=#()]/g, '').replace(/\[\w+\]/g, 'X').split('|');
		const hydrogenindexes = [];
		while(arr[1].includes('H')) {
			hydrogenindexes.push(arr[1].indexOf('H')-1);
			arr[1] = arr[1].replace('H', '');
		}
		for(let atomindexes of searcher.getMatchList()) {
			atomindexes = atomindexes.slice(arr[0].length, arr[0].length+arr[1].length);
			if(atomindexes.some(x => claimed.has(x))) continue;
			if(hydrogenindexes.some(hydrogenindex => !mol.getImplicitHydrogens(atomindexes[hydrogenindex]))) continue;
			const g = create('g');
			const text = create('text');
			text.textContent = name;
			for(const atomindex of atomindexes) {
				claimed.add(atomindex);
				const atom = atoms[atomindex];
				atom.grouptext = text;
				atom.g.classList.add('highlight');
				const highlight = create('circle');
				atom.highlight = highlight;
				g.append(highlight);
			}
			for(let i = 0; i < bonds.length; i++) {
				const atomindex1 = mol.getBondAtom(0, i);
				const atomindex2 = mol.getBondAtom(1, i);
				if(!atomindexes.includes(atomindex1) || !atomindexes.includes(atomindex2)) continue;
				bonds[i].g.classList.add('highlight');
				const highlight = create('line');
				bonds[i].highlight = highlight;
				highlight.setAttribute('stroke-width', radius*2+20);
				g.append(highlight);
			}
			get('highlights').append(g);
			const bbox = g.getBBox();
			text.setAttribute('x', bbox.x+bbox.width/2);
			text.setAttribute('y', bbox.y+bbox.height+7);
			get('highlights').append(text);
		}
	}
}
get('form').onreset = e => {
	e.preventDefault();
	get('smiles').value = '';
	get('smiles').oninput();
}
get('form').onsubmit = async e => {
	e.preventDefault();
	get('name').textContent = 'Loading';
	get('iupac').textContent = '...';
	get('info').classList.remove('hidden');
	const smile = smiles.split('.').reduce((a, b) => a.length > b.length? a: b);
	Jmol.script(jmol, 'load $'+smile);
	const result = await fetch('https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/smiles/property/CanonicalSMILES,Title,IUPACName/JSON', {
		method:'POST',
		headers:{ 'Content-Type': 'application/x-www-form-urlencoded' },
		body:'smiles='+encodeURIComponent(smile)
	}).then(x => x.json());
	console.log(result);
	if(result.Fault) {
		get('name').textContent = result.Fault.Message;
		return;
	}
	const property = result.PropertyTable.Properties[0];
	get('name').textContent = property.Title ?? '?';
	get('iupac').textContent = property.IUPACName ?? '?';
}
