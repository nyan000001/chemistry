<!DOCTYPE html>
<html>
<head>
<style>
* { font:20px monospace; }
#svg { position:fixed; top:0; left:0; width:100%; height:100%; user-select:none; stroke:#000; }
circle { r:25px; stroke-width:2; cursor:pointer; }
text { pointer-events:none; text-anchor:middle; dominant-baseline:middle; fill:#fff; paint-order:stroke fill; text-shadow:0 0 2px #000; }
line { stroke-width:2; pointer-events:none; }
line:first-of-type { stroke:transparent; stroke-width:50; pointer-events:stroke; cursor:pointer; stroke-dasharray:none !important; }
circle:hover, line:first-of-type:hover ~ line { stroke-width:3; }
.selection { stroke-width:4px; }
.error { stroke:#f00; }
.ionic { stroke-dasharray:5 5; }
#form, #info { position:fixed; bottom:0; }
#form { display:flex; }
#info { right:0; text-align:right; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="info"></div>
<svg id="svg"></svg>
<form id="form">
	<input id="smiles" spellcheck="false" type="search">
	<input type="submit" value="Identify">
</form>
<script src="https://cdn.jsdelivr.net/npm/kekule/dist/kekule.min.js"></script>
<script>
const ptable = [
	[['H', 1, '#fff', 2.2], ...Array(16).fill(null)],
	[['Li', 1, '#c8f', 0.98], ['Be', 2, '#cf0', 1.57], ...Array(10).fill(null), ['B', 3, '#fbb', 2.04], ['C', 4, '#999', 2.55], ['N', 5, '#35f', 3.04], ['O', 2, '#f00', 3.44], ['F', 1, '#9e5', 3.98]],
	[['Na', 1, '#b5f', 0.93], ['Mg', 2, '#8f0', 1.31], ...Array(10).fill(null), ['Al', 3, '#bbb', 1.61], ['Si', 4, '#fc9', 1.9], ['P', 5, '#f80', 2.19], ['S', 6, '#ff3', 2.58], ['Cl', 7, '#1f1', 3.16]],
	[['K', 1, '#84d', 0.82], ['Ca', 2, '#3f0', 1], ['Sc', 3, '#ccc', 1.36], ['Ti', 4, '#bbb', 1.54], ['V', 5, '#a6a', 1.63], ['Cr', 6, '#9ac', 1.66], ['Mn', 7, '#a7c', 1.55], ['Fe', 6, '#e63', 1.83], ['Co', 3, '#f9a', 1.88], ['Ni', 4, '#5d5', 1.91], ['Cu', 2, '#c83', 1.9], ['Zn', 2, '#78b', 1.65], ['Ga', 3, '#c99', 1.81], ['Ge', 4, '#699', 2.01], ['As', 5, '#b8e', 2.18], ['Se', 6, '#f91', 2.55], ['Br', 7, '#a22', 2.96]],
	[['Rb', 1, '#72b', 0.82], ['Sr', 2, '#0f0', 0.95], ['Y', 3, '#9ff', 1.22], ['Zr', 4, '#9dd', 1.33], ['Nb', 5, '#7cc', 1.6], ['Mo', 6, '#5bb', 2.16], ['Tc', 7, '#399', 1.9], ['Ru', 8, '#299', 2.2], ['Rh', 6, '#088', 2.28], ['Pd', 4, '#067', 2.2], ['Ag', 1, '#ccc', 1.93], ['Cd', 2, '#fd9', 1.69], ['In', 3, '#a77', 1.78], ['Sn', 4, '#688', 1.96], ['Sb', 5, '#a6b', 2.05], ['Te', 6, '#d70', 2.1], ['I', 7, '#909', 2.66]],
	[['Cs', 1, '#518', 0.79], ['Ba', 2, '#0c0', 0.89], ['La', 3, '#7df', 1.1], ['Ce', 4, '#ffc', 1.12], ['Pr', 4, '#dfc', 1.13], ['Nd', 4, '#cfc', 1.14], ['Pm', 3, '#9fc', 1.13], ['Sm', 3, '#8fc', 1.17], ['Eu', 3, '#6fc', 1.2], ['Gd', 3, '#4fc', 1.2], ['Tb', 4, '#3fc', 1.1], ['Dy', 3, '#2fc', 1.22], ['Ho', 3, '#0f9', 1.23], ['Er', 3, '#0e7', 1.24], ['Tm', 3, '#0d5', 1.25], ['Yb', 3, '#0b3', 1.1], ['Lu', 3, '#0a2', 1.27], ['Hf', 4, '#4cf', 1.3], ['Ta', 5, '#4af', 1.5], ['W', 6, '#29d', 2.36], ['Re', 7, '#278', 1.9], ['Os', 8, '#267', 2.2], ['Ir', 6, '#157', 2.2], ['Pt', 6, '#dde', 2.28], ['Au', 5, '#fd2', 2.54], ['Hg', 4, '#b8b', 2], ['Tl', 3, '#a65', 1.62], ['Pb', 4, '#575', 2.33], ['Bi', 5, '#a4b', 2.02], ['Po', 6, '#a50', 2], ['At', 7, '#754', 2.2]],
	[['Fr', 1, '#406', 0.79], ['Ra', 2, '#070', 0.9], ['Ac', 3, '#7af', 1.1], ['Th', 4, '#0bf', 1.3], ['Pa', 5, '#0af', 1.5], ['U', 6, '#09f', 1.38], ['Np', 7, '#08f', 1.36], ['Pu', 8, '#06f', 1.28], ['Am', 6, '#54f', 1.13], ['Cm', 4, '#75e', 1.28], ['Bk', 4, '#84e', 1.3], ['Cf', 3, '#a3d', 1.3], ['Es', 3, '#b1d', 1.3], ['Fm', 3, '#b1b', 1.3], ['Md', 3, '#b0a', 1.3], ['No', 2, '#b08', 1.3], ['Lr', 3, '#c06', 1.3], ['Rf', 4, '#c05', 0], ['Db', 5, '#d04', 0], ['Sg', 6, '#d04', 0], ['Bh', 7, '#e03', 0], ['Hs', 8, '#e02', 0]]
];
const svg = document.getElementById('svg');
const atoms = [];
const bonds = [];
const selections = [];
const get = id => document.getElementById(id);
const create = elem => document.createElementNS('http://www.w3.org/2000/svg', elem);
const getdistance = (a, b) => {
	const dx = b.x - a.x;
	const dy = b.y - a.y;
	return [dx, dy, Math.sqrt(dx*dx+dy*dy)];
};
function drawbond(bond) {
	const [a, b] = bond.atoms;
	const [dx, dy, distance] = getdistance(a, b) || 1;
	const nx = -dy / distance;
	const ny = dx / distance;
	const draw = (line, offset) => {
		line.setAttribute('x1', a.x + nx * offset);
		line.setAttribute('y1', a.y + ny * offset);
		line.setAttribute('x2', b.x + nx * offset);
		line.setAttribute('y2', b.y + ny * offset);
	};
	const lines = [...bond.lines.children];
	draw(lines.shift(), 0);
	for(let i = 0; i < lines.length; i++) {
		draw(lines[i], (i-(lines.length-1)/2)*6);
	}
}
function createbond(atoms, amount = 1) {
	atoms[0].bonds += amount;
	atoms[1].bonds += amount;
	let bond = bonds.find(bond => bond.atoms.includes(atoms[0]) && bond.atoms.includes(atoms[1]));
	if(!bond) {
		const lines = create('g');
		bond = { atoms, lines };
		if(Math.abs(atoms[0].electronegativity - atoms[1].electronegativity) >= 2) {
			lines.classList.add('ionic');
		}
		lines.append(create('line'));
		svg.prepend(bond.lines);
		bonds.push(bond);
		bond.lines.onpointerdown = e => {
			if(e.button) {
				removebond(bond);
			} else {
				createbond(atoms);
			}
		}
	} else if(bond.lines.children.length == 4) return;
	while(amount--) {
		bond.lines.append(create('line'));
	}
	drawbond(bond);
}
function removebond(bond, amount = 1) {
	bond.atoms[0].bonds -= amount;
	bond.atoms[1].bonds -= amount;
	while(amount--) {
		bond.lines.lastChild.remove();
	}
	if(bond.lines.children.length == 1) {
		bond.lines.remove();
		bonds.splice(bonds.indexOf(bond), 1);
	}
}
function drawatom(atom) {
	atom.circle.setAttribute('cx', atom.x);
	atom.circle.setAttribute('cy', atom.y);
	atom.circle.setAttribute('r', 10);
	atom.text.setAttribute('x', atom.x);
	atom.text.setAttribute('y', atom.y);
	for(const bond of bonds) {
		if(!bond.atoms.includes(atom)) continue;
		drawbond(bond);
	}
}
function createatom(atom) {
	atom.circle = create('circle');
	atom.text = create('text');
	[atom.element, atom.maxbonds, atom.circle.style.fill, atom.electronegativity] = ptable[atom.period][atom.group];
	atom.text.textContent = atom.element;
	svg.append(atom.circle, atom.text);
	atom.bonds = 0;
	const selection = selections.at(-1);
	if(selection) {
		createbond([selection, atom]);
	}
	atom.circle.onpointerdown = e => {
		if(e.button) {
			atom.circle.remove();
			atom.text.remove();
			for(const bond of bonds.filter(bond => bond.atoms.includes(atom))) {
				removebond(bond, bond.lines.children.length-1);
			}
			atoms.splice(atoms.indexOf(atom), 1);
			const index = selections.indexOf(atom);
			selections.splice(index, 1);
			if(index == selections.length) {
				selections.at(-1).circle.classList.add('selection');
			}
		} else {
			const selection = selections.at(-1);
			if(selection) {
				selection.circle.classList.remove('selection');
				const index = selections.indexOf(atom);
				if(index > -1) {
					selections.splice(index, 1);
				}
				if(bonds.every(bond => !bond.atoms.includes(selection) || !bond.atoms.includes(atom))) {
					createbond([selection, atom]);
				}
			}
			selections.push(atom);
			atom.circle.classList.add('selection');
		}
	}
	atoms.push(atom);
	drawatom(atom);
}
oncontextmenu = e => e.preventDefault();
onpointerdown = e => {
	if(e.target == get('form')) return;
	if(!e.button) {
		if(e.target.tagName == 'svg') {
			const atom = { x:e.pageX, y:e.pageY, period:1, group:13 };
			createatom(atom);
			selections.at(-1)?.circle.classList.remove('selection');
			selections.push(atom);
			atom.circle.classList.add('selection');
		}
		onpointermove = e => {
			const atom = selections.at(-1);
			atom.x = e.pageX;
			atom.y = e.pageY;
			drawatom(atom);
		}
	}
	generatesmiles();
}
onpointerup = () => onpointermove = null;
async function drawmolecule(smiles) {
	if(!smiles) return;
	const mol = Kekule.OpenBabel.StructUtils.generate2DStructure(Kekule.IO.loadFormatData(smiles, 'smi'));
	const kekuleatoms = mol.getNodes();
	const coords = kekuleatoms.map(kekuleatom => kekuleatom.getCoord2D());
	const x = Math.min(...coords.map(coord => coord.x));
	const y = Math.min(...coords.map(coord => coord.y));
	for(const kekuleatom of kekuleatoms) {
		const element = kekuleatom.getSymbol();
		const period = ptable.findIndex(period => period.some(atom => atom?.[0] == element));
		const group = ptable[period].findIndex(atom => atom?.[0] == element);
		const coord = kekuleatom.getCoord2D();
		const atom = { period, group, x:(coord.x-x)*100+100, y:(coord.y-y)*100+100 };
//		const atom = { period, group, x:Math.random()*100+300, y:Math.random()*100+300 };
		createatom(atom);
	}
	for(const kekulebond of mol.getConnectors()) {
		createbond(kekulebond.getConnectedObjs().map(kekuleatom => atoms[mol.indexOfNode(kekuleatom)]), kekulebond.getBondOrder());
	}
}
let smiles = decodeURIComponent(location.hash.slice(1));
get('smiles').value = smiles;
Kekule.OpenBabel.enable(() => {
	if(smiles) {
		drawmolecule(smiles);
	}
});
get('smiles').oninput = () => {
	const smiles = get('smiles').value;
	document.location.hash = encodeURIComponent(smiles);
	atoms.length = 0;
	bonds.length = 0;
	selections.length = 0;
	get('svg').innerHTML = '';
	drawmolecule(smiles);
}
let queue = Promise.resolve();
onkeydown = e => {
	if(e.target == get('smiles')) return;
	const atom = selections.at(-1);
	queue = queue.then(async () => {
		let period = atom.period;
		let group = atom.group;
		let x = 0;
		let y = 0;
		if(e.key == 'ArrowUp') {
			period--;
			y = 10;
		} else if(e.key == 'ArrowDown') {
			period++;
			y = -10;
		} else if(e.key == 'ArrowLeft') {
			group = { 'He':0, 'B':1, 'Al':1 }[atom.element] ?? group-1;
			x = 10;
		} else if(e.key == 'ArrowRight') {
			group = { 'H':17, 'Be':12, 'Mg':12 }[atom.element] ?? group+1;
			x = -10;
		}
		await atom.text.animate({ translate:['0px 0px', x+'px '+y+'px'] }, 100).finished;
		if(!ptable[period]?.[group]) {
			await atom.text.animate({ translate:[x+'px '+y+'px', '0px 0px'] }, 100).finished;
			return;
		}
		atom.period = period;
		atom.group = group;
		[atom.element, atom.maxbonds, atom.circle.style.fill, atom.electronegativity] = ptable[atom.period][atom.group];
		atom.text.textContent = atom.element;
		await atom.text.animate({ translate:[(-x)+'px '+(-y)+'px', '0px 0px'] }, 100).finished;
		drawatom(atom);
		for(const bond of bonds) {
			if(!bond.atoms.includes(atom)) continue;
			if(Math.abs(bond.atoms[0].electronegativity - bond.atoms[1].electronegativity) >= 2) {
				bond.lines.classList.add('ionic');
			} else {
				bond.lines.classList.remove('ionic');
			}
		}
		generatesmiles();
	});
}
setInterval(() => {
	const selection = selections.at(-1);
	for(const bond of bonds) {
		const [a, b] = bond.atoms;
		const [dx, dy, distance] = getdistance(a, b);
		if(!distance) {
			b.x += 100;
			continue;
		}
		const nx = dx / distance;
		const ny = dy / distance;
		const force = (distance-100) * 0.5;
		if(a != selection) {
			a.x += nx * force * 0.5;
			a.y += ny * force * 0.5;
		}
		if(b != selection) {
			b.x -= nx * force * 0.5;
			b.y -= ny * force * 0.5;
		}
	}
	for(let i = 0; i < atoms.length; i++) {
		for(let j = i+1; j < atoms.length; j++) {
			const a = atoms[i];
			const b = atoms[j];
			const dx = b.x-a.x;
			const dy = b.y-a.y;
			const distSq = dx*dx + dy*dy;
			if(distSq >= 10000) continue;
			if(!distSq) {
				a.x -= 50;
				b.x += 50;
				continue;
			}
			const distance = Math.sqrt(distSq);
			const factor = (100-distance) / 2 / distance;
			const fx = dx * factor;
			const fy = dy * factor;
			if(a != selection) {
				a.x -= fx;
				a.y -= fy;
			}
			if(b != selection) {
				b.x += fx;
				b.y += fy;
			}
		}
	}
	for(const atom of atoms) {
		drawatom(atom);
	}
}, 100);
function generatesmiles() {
	if(!atoms.length) return;
	const mol = new Kekule.Molecule();
	const map = new Map(atoms.map(a => [a, mol.appendAtom(a.element)]));
	let valid = true;
	for(const bond of bonds) {
		if(bond.atoms.some(atom => atom.bonds > atom.maxbonds)) {
			valid = false;
			bond.lines.classList.add('error');
		} else {
			bond.lines.classList.remove('error');
		}
		mol.appendBond(bond.atoms.map(atom => map.get(atom)), bond.lines.children.length-1);
	}
	const newsmiles = Kekule.IO.saveFormatData(mol, "smi");
	if(newsmiles == smiles) return;
	smiles = newsmiles;
	document.location.hash = get('smiles').value = decodeURIComponent(smiles);
	get('info').textContent = valid? '': 'Too many bonds!';
}
get('form').onsubmit = async e => {
	e.preventDefault();
	get('info').textContent = 'loading...';
	const keys = smiles.split('.').map(s => Kekule.IO.saveFormatData(Kekule.IO.loadFormatData(s, 'smi'), 'inchikey').trim()).join(',');
	const result = await fetch('https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/inchikey/'+keys+'/property/CanonicalSMILES,Title,IUPACName/JSON').then(x => x.json());
	if(result.Fault) {
		get('title').textContent = 'Error!';
		console.warn(result, result.Fault);
		return;
	}
	console.log(result);
	for(const mol of result.PropertyTable.Properties) {
		const div = document.createElement('div');
		const title = mol.Title?.toLowerCase() ?? '';
		const iupac = mol.IUPACName?.toLowerCase() ?? '';
		div.textContent = title;
		if(title != iupac) {
			div.textContent += '\n('+iupac+')';
		}
		div.textContent += '\n';
		const img = new Image();
		img.src = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/'+mol.CID+'/PNG?image_size=small';
		div.append(img);
		get('info').append(div);
	}
}
</script>
</body>
</html>
